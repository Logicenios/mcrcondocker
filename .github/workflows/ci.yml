name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/cache@v4
        id: game-assets
        with:
          path: game-assets
          key: game-assets-${{ runner.os }}-${{ hashFiles('scripts/download-assets.ts', 'scripts/download-models.ts') }}
      - run: npm run assets:download && npm run assets:models
        if: steps.game-assets.outputs.cache-hit != 'true'
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Browser smoke
        id: smoke
        run: npm run test:smoke
        env:
          SMOKE_ARTIFACT_DIR: test-results/smoke
      - name: Upload smoke failure diagnostics
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/smoke
          if-no-files-found: ignore
          retention-days: 7
